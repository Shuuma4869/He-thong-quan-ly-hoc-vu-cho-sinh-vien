spring:
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    redis:
      namespace: ams:session
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ams
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ams}
    username: ${DATABASE_USERNAME:ams}
    password: ${DATABASE_PASSWORD:ams_local_only}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ams_redis_local_only}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: AMS_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

ams:
  google-calendar:
    enabled: ${AMS_GOOGLE_CALENDAR_ENABLED:false}
    client-id: ${AMS_GOOGLE_CLIENT_ID:}
    client-secret: ${AMS_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${AMS_GOOGLE_REDIRECT_URI:}
    token-key: ${AMS_GOOGLE_TOKEN_KEY:}
    key-version: ${AMS_GOOGLE_KEY_VERSION:1}
  phenikaa:
    enabled: ${AMS_PHENIKAA_ENABLED:false}
    session-key: ${AMS_PHENIKAA_SESSION_KEY:}
    key-version: ${AMS_PHENIKAA_KEY_VERSION:1}
    connect-timeout: ${AMS_PHENIKAA_CONNECT_TIMEOUT:8s}
    response-timeout: ${AMS_PHENIKAA_RESPONSE_TIMEOUT:15s}
    max-response-bytes: ${AMS_PHENIKAA_MAX_RESPONSE_BYTES:2097152}
    read-cooldown: ${AMS_PHENIKAA_READ_COOLDOWN:5s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  sync:
    worker-enabled: ${AMS_SYNC_WORKER_ENABLED:true}
    poll-interval: ${AMS_SYNC_POLL_INTERVAL:2s}
    batch-size: ${AMS_SYNC_BATCH_SIZE:4}
    lock-ttl: ${AMS_SYNC_LOCK_TTL:2m}
    stale-timeout: ${AMS_SYNC_STALE_TIMEOUT:3m}
    max-attempts: ${AMS_SYNC_MAX_ATTEMPTS:3}
    backoff: ${AMS_SYNC_BACKOFF:10s}
    manual-cooldown: ${AMS_SYNC_MANUAL_COOLDOWN:1m}
    auto-enabled: ${AMS_SYNC_AUTO_ENABLED:false}
    auto-scan-interval: ${AMS_SYNC_AUTO_SCAN_INTERVAL:5m}
    auto-interval: ${AMS_SYNC_AUTO_INTERVAL:24h}
    auto-failure-cooldown: ${AMS_SYNC_AUTO_FAILURE_COOLDOWN:24h}
    auto-batch-size: ${AMS_SYNC_AUTO_BATCH_SIZE:4}
    retention: ${AMS_SYNC_RETENTION:90d}
    cleanup-interval: ${AMS_SYNC_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${AMS_SYNC_CLEANUP_BATCH_SIZE:100}
    history-max-page-size: ${AMS_SYNC_HISTORY_MAX_PAGE_SIZE:100}
